<!DOCTYPE html public>
<html>
<head>
<title> POEM </title>

<style>

body {
background-image:url("background.jpg");
background-repeat: no-repeat;
background-size: cover;
background-position: center;
text-align: center;
}
h1 { 
font-family: "Comic Sans Ms";
font-weight: bold;
color: jet gray;
font-size: 60px;
text-align: center;
}
p {
font-family: "Comic Sans Ms";
font-weight: bold;
color: Slate Gray;
font-size: 20px;
text-align: center;
}
img {
width: 50px;
height: 50px;
}
</style>
</head>

<body>

<h1> Ocean </h1>

<img src="pic1.jpg">
<p>
I daydream about the ocean<br>
not by the way you think.<br>
Not about the sun,<br>
or the warm sand.<br>
</p>

<img src="pic2.jpg">
<p>
I long to belong to her,<br>
for her waves to take me,<br>
pull me under,<br>
and make me apart of her.<br>
</p>

<img src="pic3.jpg">
<p style="color: LightSlateGray;">
I'd feel my body sinking,<br>
my lungs filling with silence.<br>
And I'd become her,<br>
I'd feel peace.
</p>

</body>
</html>
