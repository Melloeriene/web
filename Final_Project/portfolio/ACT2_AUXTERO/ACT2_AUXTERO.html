<h1> Ocean </h1>

<p>
I daydream about the ocean<br>
not by the way you think.<br>
Not about the sun,<br>
or the warm sand.<br>
<br>
I long to belong to her,<br>
for her waves to take me,<br>
pull me under,<br>
and make me apart of her.<br>
<br>
I'd feel my body sinking,<br>
my lungs filling with silence.<br>
And I'd become her,<br>
I'd feel peace.
</p>
